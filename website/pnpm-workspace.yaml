# pnpm 11 no longer reads the "pnpm" field from package.json — overrides live here.
# Each pin is the lowest patched release that clears an open advisory on a
# transitive dep we cannot bump directly.

overrides:
  flatted: ^3.4.2
  js-yaml: ^4.3.1
  postcss: ^8.5.23
  sharp: ^0.35.0
  "@babel/core": ^7.29.6
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.1.2
  esbuild@0.18: ^0.25.0
  minimatch@3: ^3.1.3
  minimatch@9: ^9.0.7
  nanoid@3: ^3.3.18
  picomatch@2: ^2.3.2
  picomatch@4: ^4.0.4
